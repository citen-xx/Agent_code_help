[project]
name = "java-code-agent"
version = "0.1.0"
description = "A code agent for Java GitHub repositories (project skeleton)."
readme = "README.md"
authors = [
    { name = "Yihua", email = "yihua@meiqu.hk" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "pydantic-settings>=2.15.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
